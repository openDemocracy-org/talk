name: Build openDemocracy image

# Builds the linux/amd64 image for the CapRover droplet and pushes it to
# Docker Hub as opendemocracy/coral-talk:<version>-<short sha>. Each build
# gets its own tag, so :production and :pre-v9.11 are never overwritten.
# Deploy the printed tag via CapRover → app → Deployment → Deploy via ImageName.
#
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with push rights to opendemocracy/coral-talk).

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/coral-v9.11-merge-2024

env:
  IMAGE_REPOSITORY: opendemocracy/coral-talk

jobs:
  build:
    name: Build and push amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Define image tag
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          echo "IMAGE_TAG=v${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: REVISION_HASH=${{ github.sha }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Pushed \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
